[project]
name = "labels"
version = "0.1.0"
description = "Preset-driven label printing on top of ptouch"
requires-python = ">=3.15"
dependencies = [
    "ptouch>=1.1.0",
    "pyusb>=1.3.1",
]

[project.scripts]
labels = "labels.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"
